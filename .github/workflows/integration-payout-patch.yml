name: Integration Security - Payout Patch

on:
  push:
    paths:
      - "scripts/run_integration_payout_patch.py"
      - "src/wam_security/money/**"
      - "tests/test_money_safety.py"
      - "docs/INTEGRATION_SECURITY.md"
      - ".github/workflows/integration-payout-patch.yml"
  pull_request:
    paths:
      - "scripts/run_integration_payout_patch.py"
      - "src/wam_security/money/**"
      - "tests/test_money_safety.py"
      - "docs/INTEGRATION_SECURITY.md"
      - ".github/workflows/integration-payout-patch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-main-payout-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout WAM Security
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Checkout reviewed WAM main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: wamcoin-core-dev/wam-coin
          ref: bb6d5214f2f5de3b7464587cc1b2949d221dcd18
          path: wam-coin

      - name: Run exactly-once + current-main payout review
        run: |
          PYTHONPATH=src python3 scripts/run_integration_payout_patch.py wam-coin \
            --expected-commit bb6d5214f2f5de3b7464587cc1b2949d221dcd18 \
            --cases 5000

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integration-payout-patch-evidence
          path: security-reports/integration-payout-patch.json
          if-no-files-found: error
