name: Finding Repro - Block Spool Recovery

on:
  push:
    paths:
      - "scripts/repro_block_spool_recovery.js"
      - ".github/workflows/finding-block-spool-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout WAM Security
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Checkout exact WAM revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: wamcoin-core-dev/wam-coin
          ref: bb6d5214f2f5de3b7464587cc1b2949d221dcd18
          path: wam-coin

      - name: Run local recovery reproduction
        run: |
          set -euo pipefail
          node scripts/repro_block_spool_recovery.js wam-coin             security-reports/block-spool-recovery-finding.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: block-spool-recovery-finding-evidence
          path: security-reports/block-spool-recovery-finding.json
          if-no-files-found: error
