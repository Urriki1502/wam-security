name: Integration Security - Wallet State Integrity

on:
  push:
    branches:
      - "integration-security/wallet-state-transaction-integrity"
    paths:
      - "scripts/run_wallet_state_static.py"
      - "scripts/probe_wallet_state_regtest.py"
      - "docs/WALLET_INTEGRATION_SECURITY.md"
      - ".github/workflows/integration-wallet-state-integrity.yml"
  pull_request:
    paths:
      - "scripts/run_wallet_state_static.py"
      - "scripts/probe_wallet_state_regtest.py"
      - "docs/WALLET_INTEGRATION_SECURITY.md"
      - ".github/workflows/integration-wallet-state-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  WAM_TARGET_SHA: bd71b0bd645286a3867dad6b2bfefd911ec8a5b6
  SECURITY_TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  wallet-static:
    name: Static wallet source contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout WAM Security
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Checkout exact reviewed WAM source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: wamcoin-core-dev/wam-coin
          ref: ${{ env.WAM_TARGET_SHA }}
          path: wam-src

      - name: Materialize exact patched wallet source
        working-directory: wam-src
        run: |
          set -euo pipefail
          bash scripts/fetch-upstream.sh

      - name: Validate wallet source contract
        run: |
          set -euo pipefail
          python3 scripts/run_wallet_state_static.py wam-src \
            --patched-tree wam-src/build/wam-core \
            --expected-commit "$WAM_TARGET_SHA" \
            --out security-reports/wallet-state-static.json

      - name: Upload static wallet evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wallet-state-static-evidence
          path: security-reports/wallet-state-static.json
          if-no-files-found: error

  wallet-native:
    name: Native isolated-regtest wallet lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout WAM Security
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install WAM build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils cmake curl git python3 \
            libevent-dev libboost-dev libsqlite3-dev

      - name: Checkout exact reviewed WAM source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: wamcoin-core-dev/wam-coin
          ref: ${{ env.WAM_TARGET_SHA }}
          path: wam-src

      - name: Fetch pinned Bitcoin Core + RandomX and apply WAM overlay
        working-directory: wam-src
        run: |
          set -euo pipefail
          bash scripts/fetch-upstream.sh
          test "$(git rev-parse HEAD)" = "$WAM_TARGET_SHA"

      - name: Configure patched WAM node with wallet support
        working-directory: wam-src/build/wam-core
        run: |
          set -euo pipefail
          ./autogen.sh >/dev/null
          ./configure \
            --without-gui \
            --disable-zmq \
            --disable-tests-fuzz-binary \
            --with-incompatible-bdb \
            CPPFLAGS="-I$GITHUB_WORKSPACE/wam-src/build/randomx/src" \
            LIBS="$GITHUB_WORKSPACE/wam-src/build/randomx/build/librandomx.a -lpthread" \
            >/dev/null

      - name: Build patched WAM node and wallet RPC surface
        working-directory: wam-src/build/wam-core
        run: |
          set -euo pipefail
          make -j2 wamd wam-cli

      - name: Run isolated wallet transaction/state regression
        run: |
          set -euo pipefail
          python3 scripts/probe_wallet_state_regtest.py \
            --core-tree wam-src/build/wam-core \
            --wam-source wam-src \
            --expected-commit "$WAM_TARGET_SHA" \
            --out security-reports/wallet-state-native.json

      - name: Scan evidence for secret-shaped fields
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("security-reports/wallet-state-native.json")
          obj = json.loads(path.read_text())
          text = path.read_text().lower()
          forbidden = [
              '"private_key"',
              '"privkey"',
              '"passphrase"',
              '"rpcpassword"',
              '"rpc_password"',
          ]
          leaked = [needle for needle in forbidden if needle in text]
          if leaked:
              raise SystemExit(f"secret-shaped evidence fields found: {leaked}")
          if obj.get("result") != "PASS":
              raise SystemExit("native wallet evidence did not pass")
          print("evidence secret-shape scan: PASS")
          PY

      - name: Upload native wallet evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wallet-state-native-evidence
          path: security-reports/wallet-state-native.json
          if-no-files-found: error
