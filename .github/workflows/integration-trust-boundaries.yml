name: Integration Security - Release Treasury Electrum Trust

on:
  push:
    branches:
      - "integration-security/release-treasury-electrum-trust"
    paths:
      - "src/wam_security/release_trust.py"
      - "src/wam_security/treasury/**"
      - "src/wam_security/electrum/**"
      - "reference/upstream_patch/**"
      - "tests/test_release_trust.py"
      - "tests/test_treasury_regression.py"
      - "tests/test_treasury_spend_hardened.py"
      - "tests/test_electrum_trust.py"
      - "scripts/run_release_trust_regression.py"
      - "scripts/run_treasury_static.py"
      - "scripts/run_electrum_trust_regression.py"
      - "docs/RELEASE_TRUST_MODEL.md"
      - "docs/TREASURY_SECURITY.md"
      - "docs/ELECTRUM_TRUST_MODEL.md"
      - ".github/workflows/integration-trust-boundaries.yml"
  pull_request:
    paths:
      - "src/wam_security/release_trust.py"
      - "src/wam_security/treasury/**"
      - "src/wam_security/electrum/**"
      - "reference/upstream_patch/**"
      - "tests/test_release_trust.py"
      - "tests/test_treasury_regression.py"
      - "tests/test_treasury_spend_hardened.py"
      - "tests/test_electrum_trust.py"
      - "scripts/run_release_trust_regression.py"
      - "scripts/run_treasury_static.py"
      - "scripts/run_electrum_trust_regression.py"
      - "docs/RELEASE_TRUST_MODEL.md"
      - "docs/TREASURY_SECURITY.md"
      - "docs/ELECTRUM_TRUST_MODEL.md"
      - ".github/workflows/integration-trust-boundaries.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  WAM_TARGET_SHA: bd71b0bd645286a3867dad6b2bfefd911ec8a5b6
  RELEASE_TAG: v0.1.11
  RELEASE_ARTIFACT: wam-miner-v0.1.11-x86_64-linux-gnu.tar.gz

jobs:
  local-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Compile trust-boundary code and treasury candidate
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m compileall -q \
            src/wam_security/treasury \
            src/wam_security/electrum \
            src/wam_security/release_trust.py \
            scripts/run_*trust*.py \
            scripts/run_treasury_static.py \
            reference/upstream_patch/scripts/treasury_spend_hardened.py
      - name: Run local release trust regressions
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_release_trust.py' -v
      - name: Run treasury reference regressions
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_treasury_regression.py' -v
      - name: Run hardened treasury candidate regressions
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_treasury_spend_hardened.py' -v
      - name: Run local Electrum regressions
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_electrum_trust.py' -v
      - name: Run complete security suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v

  locked-upstream-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: wamcoin-core-dev/wam-coin
          ref: ${{ env.WAM_TARGET_SHA }}
          path: wam-src
          persist-credentials: false
      - name: Bind treasury and Electrum models to locked source
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/run_treasury_static.py wam-src --out security-reports/treasury-static.json
          PYTHONPATH=src python scripts/run_electrum_trust_regression.py wam-src --out security-reports/electrum-trust.json
      - name: Confirm hardened candidate baseline remains present
        run: |
          set -euo pipefail
          test -f wam-src/scripts/treasury_spend.py
          test -f reference/upstream_patch/scripts/treasury_spend_hardened.py
          grep -F "bd71b0bd645286a3867dad6b2bfefd911ec8a5b6" \
            reference/upstream_patch/scripts/treasury_spend_hardened.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: trust-boundary-source-evidence
          path: security-reports/*.json
          if-no-files-found: error

  fresh-user-release-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: wamcoin-core-dev/wam-coin
          ref: ${{ env.WAM_TARGET_SHA }}
          path: wam-src
          persist-credentials: false
      - name: Fetch published WAM release fixtures
        run: |
          set -euo pipefail
          mkdir -p release-fixture
          base="https://github.com/wamcoin-core-dev/wam-coin/releases/download/${RELEASE_TAG}"
          curl --fail --location --retry 3 -o release-fixture/SHA256SUMS "$base/SHA256SUMS"
          curl --fail --location --retry 3 -o release-fixture/SHA256SUMS.asc "$base/SHA256SUMS.asc"
          curl --fail --location --retry 3 -o "release-fixture/${RELEASE_ARTIFACT}" "$base/${RELEASE_ARTIFACT}"
      - name: Simulate a fresh user and adversarial substitutions
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/run_release_trust_regression.py \
            wam-src release-fixture --artifact "$RELEASE_ARTIFACT" \
            --out security-reports/release-trust.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: release-trust-evidence
          path: security-reports/release-trust.json
          if-no-files-found: error
